[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "symphunk"
version = "0.1.0"
description = "One conductor, many agents, one Splunk — agentic ops layer for Splunk"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
]

[project.scripts]
symphunk = "symphunk.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["symphunk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
